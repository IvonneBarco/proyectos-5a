<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Estudiante</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

  <!-- Top Navbar -->
  <nav class="navbar navbar-light bg-white border-bottom py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="#">
        <!-- Logo / Icon Placeholder -->
        <span class="rounded-circle border border-2 border-dark d-inline-block" style="width: 28px; height: 28px;"></span>
        PROYECTOS ESTUDIANTES
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        
        <!-- Card Container -->
        <div class="card border border-2 border-dark rounded-3 p-4 shadow-sm">
          
          <!-- Section Title -->
          <h1 class="h4 text-center fw-bold mb-4">Student Profile</h1>

          <!-- Profile Image -->
          <div class="d-flex justify-content-center mb-3">
            <img src="https://via.placeholder.com/160" alt="Foto de Perfil" class="rounded-circle border border-2 border-dark img-fluid" style="width: 160px; height: 160px; object-fit: cover;">
          </div>

          <!-- Full Name -->
          <h2 class="h5 text-center fw-bold mb-4">Full Name</h2>

          <!-- Description / Lines Block -->
          <div class="mb-8 px-12">
            <div class="border-bottom border-2 border-dark pb-8 mb-12 text-muted text-left">
              Description: 
            </div>
            <div class="border-bottom border-2 border-dark pb-2 text-muted text-left">
              Academic Information:
            </div>
          </div>

          <!-- Social Media Section -->
          <div class="mb-4">
            <h3 class="h6 fw-bold text-uppercase mb-3">Social Media</h3>
            <div class="d-flex gap-3">
              <!-- Social Box 1 -->
              <a href="#" class="border border-2 border-dark rounded d-flex align-items-center justify-content-center text-dark text-decoration-none" style="width: 50px; height: 40px;">
                <i class="bi bi-globe fs-5"></i>
              </a>
              <!-- Social Box 2 -->
              <a href="#" class="border border-2 border-dark rounded d-flex align-items-center justify-content-center text-dark text-decoration-none" style="width: 50px; height: 40px;">
                <i class="bi bi-linkedin fs-5"></i>
              </a>
              <!-- Social Box 3 -->
              <a href="#" class="border border-2 border-dark rounded d-flex align-items-center justify-content-center text-dark text-decoration-none" style="width: 50px; height: 40px;">
                <i class="bi bi-github fs-5"></i>
              </a>
            </div>
          </div>

          <!-- Back Button -->
          <div class="d-flex justify-content-end mt-3">
            <a href="#" class="btn btn-outline-dark border-2 px-4 py-1">Back</a>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
