<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Huella -->
  <g fill="#ffffff" fill-opacity="0.95" transform="translate(300 150)">
    <ellipse cx="0" cy="28" rx="46" ry="38"/>
    <ellipse cx="-52" cy="-22" rx="17" ry="22"/>
    <ellipse cx="-20" cy="-50" rx="17" ry="23"/>
    <ellipse cx="20" cy="-50" rx="17" ry="23"/>
    <ellipse cx="52" cy="-22" rx="17" ry="22"/>
  </g>

  <!-- Cruz de farmacia sobre la almohadilla -->
  <g fill="#0d9488" transform="translate(300 178)">
    <rect x="-7" y="-20" width="14" height="40" rx="3"/>
    <rect x="-20" y="-7" width="40" height="14" rx="3"/>
  </g>

  <text x="300" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="56" font-weight="800" fill="#ffffff" letter-spacing="1">VetStock</text>
  <text x="300" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
